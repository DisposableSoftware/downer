[package]
name = "downer"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["gnome_49"] }
pulldown-cmark = { version = "0.13.4", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
