# $XDG_CONFIG_HOME/downer/config.ini  (usually ~/.config/downer/config.ini)
# Every key is optional. Restart Downer to apply changes.
# Extra GTK CSS goes in style.css next to this file.

[appearance]
# latte | frappe | macchiato | mocha, or gtk to use the GTK theme's colours and accent
flavor = mocha
# rosewater flamingo pink mauve red maroon peach yellow green teal sky sapphire blue lavender
# (ignored with flavor = gtk)
accent = mauve
# Window background alpha, 0.0 – 1.0
opacity = 0.85
